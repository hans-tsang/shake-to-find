name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Build exe
        run: pyinstaller --noconfirm --onefile --noconsole --name ShakeToFind --hidden-import pystray._win32 main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ShakeToFind
          path: dist/ShakeToFind.exe
